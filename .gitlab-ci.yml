image: unityci/editor:ubuntu-6000.0.72f1-windows-mono-3

workflow:
  rules:
    # Restrict the entire pipeline to only run on the CI-Setup branch for testing.
    - if: '$CI_COMMIT_BRANCH == "CI-Setup"'

stages:
  - build
  - test

variables:
  BUILD_NAME: "PathfinderTactics"
  BUILD_TARGET: "StandaloneWindows64"


build-windows:
  stage: build
  script:
    - echo "Building $BUILD_NAME for $BUILD_TARGET..."
    - mkdir -p Builds/Windows
    - unity-editor -batchmode -nographics -quit -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath "$CI_PROJECT_DIR" -buildWindowsPlayer "$CI_PROJECT_DIR/Builds/Windows/$BUILD_NAME.exe"
  artifacts:
    name: "${BUILD_NAME}_${CI_COMMIT_SHORT_SHA}"
    paths:
      - Builds/Windows/
    expire_in: 1 week

test-playmode:
  stage: test
  script:
    - echo "Running PlayMode tests..."
    - mkdir -p TestResults
    - unity-editor -batchmode -nographics -quit -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath "$CI_PROJECT_DIR" -runTests -testPlatform PlayMode -testResults "$CI_PROJECT_DIR/TestResults/playmode-results.xml"
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/playmode-results.xml
  allow_failure: true

test-editmode:
  stage: test
  script:
    - echo "Running EditMode tests..."
    - mkdir -p TestResults
    - unity-editor -batchmode -nographics -quit -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath "$CI_PROJECT_DIR" -runTests -testPlatform EditMode -testResults "$CI_PROJECT_DIR/TestResults/editmode-results.xml"
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/editmode-results.xml
  allow_failure: true
