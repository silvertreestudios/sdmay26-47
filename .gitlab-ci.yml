stages:
  - build
  - test

variables:
  # The path to the Unity Editor executable on the GitLab Runner (using typical install path)
  UNITY_EXECUTABLE: "C:\\Program Files\\Unity\\Hub\\Editor\\6000.0.72f1\\Editor\\Unity.exe"
  BUILD_NAME: "PathfinderTactics"
  BUILD_TARGET: "StandaloneWindows64"

# Set a default tag globally so all jobs run on the 'windows' runner
default:
  tags:
    - windows

build-windows:
  stage: build
  script:
    - echo "Building $BUILD_NAME for $BUILD_TARGET..."
    - New-Item -ItemType Directory -Force -Path "Builds\Windows" -ErrorAction SilentlyContinue
    - '& "$UNITY_EXECUTABLE" -batchmode -nographics -quit -projectPath "$CI_PROJECT_DIR" -buildWindowsPlayer "$CI_PROJECT_DIR\Builds\Windows\$BUILD_NAME.exe"'
  artifacts:
    name: "${BUILD_NAME}_${CI_COMMIT_SHORT_SHA}"
    paths:
      - Builds/Windows/
    expire_in: 1 week

test-playmode:
  stage: test
  script:
    - echo "Running PlayMode tests..."
    - New-Item -ItemType Directory -Force -Path "TestResults" -ErrorAction SilentlyContinue
    - '& "$UNITY_EXECUTABLE" -batchmode -nographics -quit -projectPath "$CI_PROJECT_DIR" -runTests -testPlatform PlayMode -testResults "$CI_PROJECT_DIR\TestResults\playmode-results.xml"'
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/playmode-results.xml
  allow_failure: true

test-editmode:
  stage: test
  script:
    - echo "Running EditMode tests..."
    - New-Item -ItemType Directory -Force -Path "TestResults" -ErrorAction SilentlyContinue
    - '& "$UNITY_EXECUTABLE" -batchmode -nographics -quit -projectPath "$CI_PROJECT_DIR" -runTests -testPlatform EditMode -testResults "$CI_PROJECT_DIR\TestResults\editmode-results.xml"'
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/editmode-results.xml
  allow_failure: true
