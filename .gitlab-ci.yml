image: unityci/editor:ubuntu-6000.0.72f1-windows-mono-3

workflow:
  rules:
    # Restrict the entire pipeline to only run on the CI-Setup branch for testing.
    - if: '$CI_COMMIT_BRANCH == "CI-Setup"'

stages:
  - build
  - test

variables:
  BUILD_NAME: "PathfinderTactics"
  BUILD_TARGET: "StandaloneWindows64"


# A reusable snippet to check and write the Unity License
.license-check: &license-check
  - echo "Ensuring Unity license is set..."
  - if [ -z "$UNITY_LICENSE" ]; then echo "UNITY_LICENSE variable is not set. Please set it in GitLab CI/CD settings."; exit 1; fi
  - mkdir -p /root/.local/share/unity3d/Unity/
  - cp "$UNITY_LICENSE" /root/.local/share/unity3d/Unity/Unity_lic.ulf

build-windows:
  stage: build
  before_script:
    - *license-check
  script:
    - echo "Building $BUILD_NAME for $BUILD_TARGET..."
    - mkdir -p Builds/Windows
    - unity-editor -batchmode -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath "$CI_PROJECT_DIR" -buildWindowsPlayer "$CI_PROJECT_DIR/Builds/Windows/$BUILD_NAME.exe"
  artifacts:
    name: "${BUILD_NAME}_${CI_COMMIT_SHORT_SHA}"
    paths:
      - Builds/Windows/
    expire_in: 1 week

test-playmode:
  stage: test
  before_script:
    - *license-check
  script:
    - echo "Running PlayMode tests..."
    - mkdir -p TestResults
    - unity-editor -batchmode -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath "$CI_PROJECT_DIR" -runTests -testPlatform PlayMode -testResults "$CI_PROJECT_DIR/TestResults/playmode-results.xml"
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/playmode-results.xml
  allow_failure: true

test-editmode:
  stage: test
  before_script:
    - *license-check
  script:
    - echo "Running EditMode tests..."
    - mkdir -p TestResults
    - unity-editor -batchmode -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath "$CI_PROJECT_DIR" -runTests -testPlatform EditMode -testResults "$CI_PROJECT_DIR/TestResults/editmode-results.xml"
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/editmode-results.xml
  allow_failure: true
