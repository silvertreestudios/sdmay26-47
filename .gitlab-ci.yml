workflow:
  rules:
    # Restrict the entire pipeline to only run on the CI-Setup branch for testing.
    - if: '$CI_COMMIT_BRANCH == "CI-Setup"'

stages:
  - build
  - test

variables:
  BUILD_NAME: "PathfinderTactics"
  BUILD_TARGET: "StandaloneWindows64"
  UNITY_PATH: 'C:\Program Files\Unity\Hub\Editor\6000.0.72f1\Editor\Unity.exe'

build-windows:
  stage: build
  tags: ["windows", "self-hosted"]
  script:
    - echo "Building $env:BUILD_NAME for $env:BUILD_TARGET..."
    - New-Item -ItemType Directory -Force -Path "Builds\Windows" | Out-Null
    - '& "$env:UNITY_PATH" -batchmode -nographics -quit -projectPath "$env:CI_PROJECT_DIR" -buildWindowsPlayer "$env:CI_PROJECT_DIR\Builds\Windows\$env:BUILD_NAME.exe" -logFile -'
  artifacts:
    name: "${BUILD_NAME}_${CI_COMMIT_SHORT_SHA}"
    paths:
      - Builds/Windows/
    expire_in: 1 week

test-playmode:
  stage: test
  tags: ["windows", "self-hosted"]
  script:
    - echo "Running PlayMode tests..."
    - New-Item -ItemType Directory -Force -Path "TestResults" | Out-Null
    - '& "$env:UNITY_PATH" -batchmode -nographics -quit -projectPath "$env:CI_PROJECT_DIR" -runTests -testPlatform PlayMode -testResults "$env:CI_PROJECT_DIR\TestResults\playmode-results.xml" -logFile "$env:CI_PROJECT_DIR\Logs\playmode.log"'
    - if (-not (Test-Path "TestResults\playmode-results.xml")) { Set-Content "TestResults\playmode-results.xml" '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="PlayMode" tests="0" failures="0" errors="0"/></testsuites>' }
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/playmode-results.xml
  allow_failure: true

test-editmode:
  stage: test
  tags: ["windows", "self-hosted"]
  script:
    - echo "Running EditMode tests..."
    - New-Item -ItemType Directory -Force -Path "TestResults" | Out-Null
    - '& "$env:UNITY_PATH" -batchmode -nographics -quit -projectPath "$env:CI_PROJECT_DIR" -runTests -testPlatform EditMode -testResults "$env:CI_PROJECT_DIR\TestResults\editmode-results.xml" -logFile "$env:CI_PROJECT_DIR\Logs\editmode.log"'
    - if (-not (Test-Path "TestResults\editmode-results.xml")) { Set-Content "TestResults\editmode-results.xml" '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="EditMode" tests="0" failures="0" errors="0"/></testsuites>' }
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/editmode-results.xml
  allow_failure: true
